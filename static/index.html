<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новостной портал — Толстый клиент (SPA / CSR)</title>

    <!--
    ========================================================================================
    ТОЛСТЫЙ КЛИЕНТ: ЕДИНСТВЕННЫЙ HTML-КАРКАС (SPA Shell)
    ========================================================================================
    В отличие от "тонкого" клиента, этот HTML-файл НЕ содержит готового контента страниц новостей.
    Он содержит лишь каркасные контейнеры (#navbar-container, #alerts-container, #app-content),
    а весь интерфейс формируется динамически на стороне клиента модулями JavaScript (Client-Side Rendering).
    ========================================================================================
    -->

    <!-- Внешние библиотеки стилей и иконок -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Библиотека визуализации графиков Chart.js (рендерит графики в браузере) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Пользовательские стили -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Контейнер для динамической навигационной панели (генерируется UI.renderNavbar()) -->
    <header id="navbar-container"></header>

    <!-- Контейнер для всплывающих уведомлений об успехе/ошибках (UI.showAlert()) -->
    <div class="container mt-3">
        <div id="alerts-container"></div>
    </div>

    <!--
    ГЛАВНЫЙ КОНТЕЙНЕР ТОЛСТОГО КЛИЕНТА:
    Сюда JavaScript динамически монтирует каждую страницу (главную, новости, статью, админку)
    без перезагрузки окна браузера.
    -->
    <main class="container my-4" id="app-content">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2 text-muted">Инициализация толстого клиента...</p>
        </div>
    </main>

    <!-- Подвал сайта -->
    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="mb-1"><i class="fas fa-newspaper me-2"></i>Новостной портал</h5>
                    <p class="mb-0 text-muted small">Клиент-серверное веб-приложение с генерацией UI на стороне клиента (SPA / Толстый клиент)</p>
                </div>
                <div class="col-md-6 text-md-end mt-2 mt-md-0">
                    <p class="mb-0 text-muted small">&copy; 2026 Все права защищены</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--
    СКРИПТЫ ТОЛСТОГО КЛИЕНТА (загружаются в строгом порядке зависимостей):
    1. api.js    — Сетевой клиент, JWT-аутентификация, localStorage, асинхронные вызовы REST API
    2. ui.js     — Генератор UI (Client-Side Rendering): превращает JSON-данные в HTML-разметку
    3. router.js — Клиентский маршрутизатор (Hash-based Routing): отслеживает смену #хэшей
    4. app.js    — Точка входа: проверяет сессию и запускает маршрутизатор
    -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/router.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
